# QueryMind baseline configuration.
# Command line flags (--provider, --model, --arm, --db, --max-rows) override these.
# Unknown keys are rejected loudly rather than ignored.

# One of: asu | openai | mock
#   asu    -> ASU OpenCode gateway, needs OPENCODE_API_KEY and OPENCODE_BASE_URL
#   openai -> any OpenAI-compatible endpoint, needs OPENAI_API_KEY
#   mock   -> offline rule-based stub, needs no credentials
provider: mock

model: muse-glimmer-30b

# Prompt arm. b0 is the frozen measurement floor; b1 adds permission to refuse.
arm: b0

database_path: data/analytics.db

# Row cap for printed results. A truncated table is flagged in the output and in
# the trace, so it is never mistaken for a complete answer.
max_rows: 50
